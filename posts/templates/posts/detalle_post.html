{% extends 'posts/base.html' %}

{% block titulo %}{{ post.titulo }} - Tesoro Digital{% endblock %}

{% block content %}
<article class="post-detalle">
    <p><a href="{% url 'lista_posts' %}">← Volver a las notas</a></p>
    <span class="tarjeta-post-icono">{{ post.icono }}</span>
    <h1>{{ post.titulo }}</h1>
    <div class="post-detalle-meta">
        <span>{{ post.autor }}</span>
        <span>{{ post.fecha_creacion|date:"d/m/Y" }}</span>
    </div>
    <div class="post-detalle-cuerpo">
        {{ post.contenido|linebreaks }}
    </div>
</article>
{% endblock %}
