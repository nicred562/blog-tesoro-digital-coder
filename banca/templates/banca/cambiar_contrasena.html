{% extends 'posts/base.html' %}

{% block titulo %}Cambiar contraseña - Tesoro Digital{% endblock %}

{% block content %}
<section class="formulario-angosto">
    <h1>Cambiar contraseña</h1>
    <form method="post" novalidate>
        {% csrf_token %}
        {{ form.non_field_errors }}
        {{ form.as_p }}
        <button type="submit" class="boton">Guardar nueva contraseña</button>
    </form>
    <p><a href="{% url 'banca:perfil' %}">Volver a mi perfil</a></p>
</section>
{% endblock %}
