{% extends 'posts/base.html' %}

{% block titulo %}Pedir dinero - Tesoro Digital{% endblock %}

{% block content %}
<section class="formulario-angosto">
    <h1>Pedir dinero</h1>
    <form method="post" novalidate>
        {% csrf_token %}
        {{ form.non_field_errors }}
        {{ form.as_p }}
        <button type="submit" class="boton">Enviar solicitud</button>
    </form>
    <p><a href="{% url 'banca:solicitudes' %}">Ver mis solicitudes</a></p>
</section>
{% endblock %}
